<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    /* Custom Styling & Animations */
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #08070b;
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
      margin: 0;
      position: relative;
    }

    /* Floating Particles Background */
    #particles-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
    }

    /* Dynamic Heartbeat Pulse for Envelope */
    @keyframes envelopePulse {
      0%, 100% {
        transform: scale(1) rotate(0deg);
        filter: drop-shadow(0 15px 25px rgba(211, 47, 47, 0.4));
      }
      20% {
        transform: scale(1.08) rotate(-2deg);
        filter: drop-shadow(0 20px 35px rgba(255, 75, 75, 0.6));
      }
      40% {
        transform: scale(0.98) rotate(1deg);
      }
      60% {
        transform: scale(1.05) rotate(-1deg);
      }
    }

    .pulse-fast {
      animation: envelopePulse var(--pulse-speed, 1.2s) infinite ease-in-out !important;
    }

    /* Red 3D Envelope Styles */
    .envelope-wrapper {
      position: absolute;
      width: 220px;
      height: 150px;
      cursor: pointer;
      z-index: 20;
      transition: top 0.45s cubic-bezier(0.25, 1, 0.5, 1), left 0.45s cubic-bezier(0.25, 1, 0.5, 1), transform 0.3s ease;
      top: 55%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .envelope-3d {
      width: 100%;
      height: 100%;
      background: linear-gradient(145deg, #d32f2f, #9a0007);
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), inset 0 1px 2px rgba(255, 255, 255, 0.3);
      position: relative;
      perspective: 1000px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    /* Flap Top */
    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 110px solid transparent;
      border-right: 110px solid transparent;
      border-top: 85px solid #b71c1c;
      transform-origin: top;
      transition: transform 0.6s ease-in-out;
      z-index: 4;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    }

    /* Flap Bottom & Sides */
    .envelope-pocket {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 0 0 12px 12px;
      z-index: 2;
    }

    .envelope-pocket::before {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 110px solid #7f0000;
      border-right: 110px solid #7f0000;
      border-bottom: 80px solid #8e0000;
    }

    /* Heart Seal */
    .heart-seal {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #ffd700, #ff9800);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      z-index: 5;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5), inset 0 1px 2px rgba(255,255,255,0.8);
      border: 1px solid #ffe082;
      transition: transform 0.2s;
    }

    .envelope-wrapper:hover .heart-seal {
      transform: translateX(-50%) scale(1.1);
    }

    /* Vintage Paper Styles */
    .vintage-paper {
      background: #fdfaf2;
      background-image: 
        linear-gradient(rgba(190, 160, 130, 0.15) 1px, transparent 1px),
        linear-gradient(90deg, rgba(230, 100, 100, 0.2) 1px, transparent 1px);
      background-size: 100% 2.2rem, 100% 100%;
      background-position: 0 0, 45px 0;
      color: #2c2523;
      box-shadow: 
        0 15px 35px rgba(0, 0, 0, 0.6),
        inset 0 0 60px rgba(210, 180, 140, 0.35),
        inset 0 0 15px rgba(139, 69, 19, 0.15);
      border: 1px solid #e2d7c5;
    }

    .letter-content {
      font-family: 'Dancing Script', cursive;
      font-size: 1.85rem;
      line-height: 2.2rem;
      word-break: break-word;
      white-space: pre-wrap;
    }

    /* Floating Pencil Indicator */
    #pencil-cursor {
      position: fixed;
      font-size: 2.2rem;
      pointer-events: none;
      z-index: 100;
      display: none;
      transition: top 0.04s ease-out, left 0.04s ease-out;
      transform: translate(-10%, -90%) rotate(-15deg);
      filter: drop-shadow(3px 5px 4px rgba(0,0,0,0.4));
    }

    /* Scrollbar styling for paper */
    .custom-scrollbar::-webkit-scrollbar {
      width: 7px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.05);
      border-radius: 8px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #c2b29d;
      border-radius: 8px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #a3917a;
    }

    /* Glow Button Effect */
    .glow-btn {
      box-shadow: 0 0 15px rgba(37, 211, 102, 0.4);
      transition: all 0.3s ease;
    }
    .glow-btn:hover {
      box-shadow: 0 0 25px rgba(37, 211, 102, 0.8);
      transform: translateY(-2deg);
    }
  </style>
</head>

  <script>
    const FULL_TEXT = "         N.A.P.C 🖤🤍, No colocare el nombre por que, al estar alojado en la Web, mantener la identidad es lo mas importante, pero tú sabes que es para ti. Imperial Queen 🤍 A lo largo de mi vida jamás imaginé encontrar a alguien que llegara a ser tan importante para mí. Hubo momentos en que éramos un espejismo de felicidad y otros en que, sin querer, nos hacíamos creer que no nos importabamos. Sin embargo, desde el principio hubo una buena conexión que, al menos yo, no creo encontrar en otra persona… tu risa llenaba mis días y tus silencios, auch.... Al principio me costó la distancia, para ser sincero, duele no tenerte cerca. Aunque ya no formamos parte de la vida del otro como antes, no quería dejar pasar este día sin escribirte. No por compromiso, sino porque fuiste y sigues siendo una presencia profunda en mi corazón. Alguien profundamente importante para mí. Aunque el camino nos llevó por distintos rumbos, nunca he dejado de agradecer por haberte conocido. Me enseñaste muchas cosas, con tu intensidad y tu ternura extraña. Hubo un momento en que todo estaba bien y, de pronto, cambió de un día para otro. Y esto va para esa persona que un día fui tan afortunado de conocer: gracias por tu sinceridad, por tu alma transparente y por permitirme admirar tu luz. Siento no haber estado a la altura de tu grandeza; nací para contemplar astros, y tú, Impe 🤍, fuiste la más resplandeciente, tanto que te vi como una llama púrpura y blanca, hermosa y acogedora, pero capaz de herir letalmente, y todo tal vez sin que lo supieras. Obviamente, fue solo una idea, pero siempre se me hacia curioso que te encantara verte en los espejos de la casa; pensaba que tenías todo para hacerlo, ya que, después de ti, lo más bonito era tu reflejo. disculpa por traerlo pero tu primer amor tuvo la suerte de verte florecer; confieso que sentí celos y hoy algo de envidia por ese privilegio. con todo y que tenia los momentos asi fueran solo dos segundos a pesar de sonar a poco tiempo, eran finitos apenas dos segundos podía verte sonreír, rozar tu cabello y transformar mi día. Mis errores fueron dudar, sobrepensar y esperar sin actuar. Expresar lo que se siente no debería romper vínculos fuertes. Hoy, en tu cumpleaños, solo te deseo tu felicidad auténtica, dicha plena, mucha serenidad, proyectos que enciendan tu ilusión, personas que te valoren y motivos para sonreír cada amanecer. Cada recuerdo, todas tus risas y los pocos abrazos vivirán por siempre en lo más íntimo de mi ser. Feliz cumpleaños 🎇🎆🎂🎈🎉, Imperial Queen 🤍. Gracias por haber sido parte de mi historia y por permitirme ser parte de la tuya, aunque fuera por un tiempo. Te quiero mucho 11/06/2019 (no se si llegaras a entender la referencia) 🤍 Ah y déjame dormir 😅 ¿qué te escapaste De bombón? ¿De qué estuche divino? un pedacito de Pareces ángel que se soltó de un cielo te lanzo un travieso y un guiño beso. 🍫 Solo es una carta escrita especialmente para ti, con todo mi cariño... ATT: H.3.6.9";

    const ENCOURAGEMENTS = [
      "¡Haz clic en el sobre para intentarlo!",
      "¡Uy, casi! Es escurridiza...",
      "¡Se vuelve a mover! ¡Sigue intentando!",
      "¡Su corazón late más rápido!",
      "¡Un esfuerzo más, ya casi la atrapas!",
      "¡Último clic para abrir!"
    ];

    let clickCount = 0;
    const MAX_CLICKS = 6;
    let isWriting = false;
    let textIndex = 0;
    let typewriterTimeout = null;

    // DOM Elements
    const envelopeContainer = document.getElementById('envelope-container');
    const envelopeFlap = document.getElementById('envelope-flap');
    const instructionTitle = document.getElementById('instruction-title');
    const clicksText = document.getElementById('clicks-text');
    const encouragementText = document.getElementById('encouragement-text');
    const clickDots = document.getElementById('click-dots').children;
    const stageIntro = document.getElementById('stage-intro');
    const stageReading = document.getElementById('stage-reading');
    const paperBox = document.getElementById('paper-box');
    const letterBody = document.getElementById('letter-body');
    const pencilCursor = document.getElementById('pencil-cursor');
    const btnSkip = document.getElementById('btn-skip');
    const inlineWhatsappWrapper = document.getElementById('inline-whatsapp-wrapper');
    const brandingLogo = document.getElementById('branding-logo');

    const canvas = document.getElementById('particles-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = canvas.height + 20;
        this.size = Math.random() * 12 + 8;
        this.speedY = Math.random() * 1.2 + 0.5;
        this.speedX = (Math.random() - 0.5) * 0.8;
        this.opacity = Math.random() * 0.5 + 0.2;
        this.type = Math.random() > 0.4 ? 'heart' : 'sparkle';
      }
      update() {
        this.y -= this.speedY;
        this.x += this.speedX;
        if (this.y < -20) this.reset();
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = this.opacity;
        if (this.type === 'heart') {
          ctx.fillStyle = '#f43f5e';
          ctx.font = `${this.size}px sans-serif`;
          ctx.fillText('🤍', this.x, this.y);
        } else {
          ctx.fillStyle = '#fbbf24';
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size / 4, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }
    }

    for (let i = 0; i < 30; i++) {
      particles.push(new Particle());
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    let audioCtx = null;
    let heartbeatInterval = null;

    function initAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // Dynamic Synthesized Heartbeat Sound
    function playHeartbeatBeat(bpm) {
      if (!audioCtx) return;
      
      const now = audioCtx.currentTime;

      // Lub
      const osc1 = audioCtx.createOscillator();
      const gain1 = audioCtx.createGain();
      osc1.type = 'sine';
      osc1.frequency.setValueAtTime(65, now);
      osc1.frequency.exponentialRampToValueAtTime(25, now + 0.12);
      gain1.gain.setValueAtTime(0.7, now);
      gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
      osc1.connect(gain1);
      gain1.connect(audioCtx.destination);
      osc1.start(now);
      osc1.stop(now + 0.12);

      // Dub (slightly delayed)
      setTimeout(() => {
        if (!audioCtx) return;
        const dubNow = audioCtx.currentTime;
        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(85, dubNow);
        osc2.frequency.exponentialRampToValueAtTime(30, dubNow + 0.12);
        gain2.gain.setValueAtTime(0.5, dubNow);
        gain2.gain.exponentialRampToValueAtTime(0.001, dubNow + 0.12);
        osc2.connect(gain2);
        gain2.connect(audioCtx.destination);
        osc2.start(dubNow);
        osc2.stop(dubNow + 0.12);
      }, 160);
    }

    function updateHeartbeatSpeed() {
      initAudioContext();
      if (heartbeatInterval) clearInterval(heartbeatInterval);

      // BPM increases from 60 to 140 bpm as clics increase
      const bpm = 60 + (clickCount * 15);
      const intervalMs = (60 / bpm) * 1000;
      
      // Update animation speed in CSS
      envelopeContainer.style.setProperty('--pulse-speed', `${60 / bpm}s`);

      playHeartbeatBeat(bpm);
      heartbeatInterval = setInterval(() => {
        playHeartbeatBeat(bpm);
      }, intervalMs);
    }

    function stopHeartbeat() {
      if (heartbeatInterval) clearInterval(heartbeatInterval);
    }

    // Procedural Typing Key Click Sound
    function playKeySound() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const filter = audioCtx.createBiquadFilter();

      // White noise click feel
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(300 + Math.random() * 400, now);
      osc.frequency.exponentialRampToValueAtTime(80, now + 0.03);

      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);

      filter.type = 'highpass';
      filter.frequency.setValueAtTime(1000, now);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + 0.03);
    }

    envelopeContainer.addEventListener('click', (e) => {
      e.stopPropagation();
      initAudioContext();

      if (clickCount < MAX_CLICKS - 1) {
        clickCount++;
        updateProgressUI();
        moveEnvelopeRandomly();
        updateHeartbeatSpeed();
      } else if (clickCount === MAX_CLICKS - 1) {
        clickCount++;
        updateProgressUI();
        openEnvelopeSequence();
      }
    });

    function updateProgressUI() {
      clicksText.textContent = `${clickCount} / ${MAX_CLICKS}`;
      encouragementText.textContent = ENCOURAGEMENTS[clickCount] || "";

      // Update dot indicators
      for (let i = 0; i < clickDots.length; i++) {
        if (i < clickCount) {
          clickDots[i].classList.remove('bg-rose-500/30');
          clickDots[i].classList.add('bg-rose-400', 'shadow-[0_0_8px_rgba(251,113,133,0.8)]', 'scale-110');
        }
      }
    }

    function moveEnvelopeRandomly() {
      const margin = 80;
      const maxX = window.innerWidth - 240 - margin;
      const maxY = window.innerHeight - 200 - margin;

      const randomX = Math.max(margin, Math.floor(Math.random() * maxX));
      const randomY = Math.max(margin + 80, Math.floor(Math.random() * maxY));

      envelopeContainer.style.transform = 'none';
      envelopeContainer.style.left = `${randomX}px`;
      envelopeContainer.style.top = `${randomY}px`;
    }

    function openEnvelopeSequence() {
      stopHeartbeat();
      
      // Stop movement animations
      envelopeContainer.classList.remove('pulse-fast');
      envelopeContainer.style.transform = 'translate(-50%, -50%) scale(1.1)';
      envelopeContainer.style.left = '50%';
      envelopeContainer.style.top = '50%';

      instructionTitle.textContent = "¡La abriste! ✨";
      encouragementText.textContent = "Desplegando tu carta...";

      setTimeout(() => {
        // Open flap
        envelopeFlap.style.transform = 'rotateX(180deg)';
      }, 400);

      setTimeout(() => {
        // Transition to Reading Stage
        stageIntro.classList.add('opacity-0', 'transition-opacity', 'duration-500');
        setTimeout(() => {
          stageIntro.style.display = 'none';
          stageReading.classList.remove('hidden');
          setTimeout(() => {
            stageReading.classList.remove('opacity-0');
            startWriting();
          }, 50);
        }, 500);
      }, 1200);
    }

    function startWriting() {
      isWriting = true;
      pencilCursor.style.display = 'block';
      writeNextCharacter();
    }

    function writeNextCharacter() {
      if (!isWriting) return;

      if (textIndex < FULL_TEXT.length) {
        const char = FULL_TEXT.charAt(textIndex);
        const charSpan = document.createElement('span');
        charSpan.textContent = char;
        letterBody.appendChild(charSpan);

        // Position pencil cursor next to current letter
        const rect = charSpan.getBoundingClientRect();
        if (rect.width > 0 && rect.height > 0) {
          pencilCursor.style.left = `${rect.right + 2}px`;
          pencilCursor.style.top = `${rect.top + 5}px`;
        }

        // Play typing audio sound intermittently
        if (textIndex % 2 === 0 && char.trim() !== '') {
          playKeySound();
        }

        // Auto-scroll paper box
        paperBox.scrollTop = paperBox.scrollHeight;

        textIndex++;
        typewriterTimeout = setTimeout(writeNextCharacter, 45);
      } else {
        finishWriting();
      }
    }

    btnSkip.addEventListener('click', () => {
      if (!isWriting) return;
      isWriting = false;
      clearTimeout(typewriterTimeout);
      letterBody.textContent = FULL_TEXT;
      finishWriting();
    });

    function finishWriting() {
      isWriting = false;
      pencilCursor.style.display = 'none';
      btnSkip.style.display = 'none';

      // Reveal inline WhatsApp CTA
      inlineWhatsappWrapper.classList.remove('hidden');
      paperBox.scrollTop = paperBox.scrollHeight;

      // Show Hekbel Branding Logo
      setTimeout(() => {
        brandingLogo.classList.remove('opacity-0');
        brandingLogo.classList.add('opacity-100');
      }, 1500);
    }
  </script>
</body>
</html>
